name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install, typecheck, build, validate, link check, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # `next build` also enforces the TypeScript check because
        # next.config.ts has typescript.ignoreBuildErrors: false.
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate content
        run: npm run validate:content

      - name: Link check
        run: |
          PORT=3000 NODE_ENV=production node .next/standalone/server.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done

          # Crawl the built app; only internal links are checked so flaky
          # third-party sites cannot fail CI.
          npx --yes linkinator@6 http://localhost:3000 \
            --recurse \
            --skip "^(?!http://localhost:3000)" \
            --verbosity error

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        # playwright.config.ts starts the production build itself on 3100;
        # port 3000 stays free for the link check above.
        run: npx playwright test
